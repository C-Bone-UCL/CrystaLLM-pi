name: CI Optional CPU Secrets

"on":
  workflow_dispatch:

jobs:
  local-secrets-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_KEY: ${{ secrets.HF_KEY }}
      WANDB_KEY: ${{ secrets.WANDB_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: uv sync --locked --extra train --extra metrics --extra notebooks

      - name: Run local suite with secret-dependent checks
        if: ${{ env.HF_KEY != '' && env.WANDB_KEY != '' }}
        env:
          HF_KEY: ${{ env.HF_KEY }}
          WANDB_KEY: ${{ env.WANDB_KEY }}
        run: uv run python -m tests.local.runner --cpu --secrets

      - name: Fallback to offline suite when secrets are missing
        if: ${{ env.HF_KEY == '' || env.WANDB_KEY == '' }}
        run: |
          echo "HF_KEY or WANDB_KEY is missing; running offline tier instead."
          uv run python -m tests.local.runner --cpu --offline

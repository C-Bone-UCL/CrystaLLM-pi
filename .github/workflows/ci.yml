name: CI Offline Required

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  offline-local-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install offline test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/ci/requirements-offline.txt
          pip install -e .

      - name: Run required offline local suite
        run: python -m tests.local.runner --cpu --offline

  # `pip install -e .` resolves package data from the source tree, so it cannot catch a
  # model_registry.json or HF-cif-tokenizer that never made it into the wheel. Installing the
  # built wheel and importing from outside the checkout is the only check that does.
  wheel-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install and import it outside the source tree
        run: |
          mkdir /tmp/wheeltest
          pip install "$GITHUB_WORKSPACE"/dist/*.whl
          cd /tmp/wheeltest
          python -c "
          import _load_and_generate
          from _utils.model import MODEL_REGISTRY
          from _tokenizer import CustomCIFTokenizer
          assert MODEL_REGISTRY, 'model_registry.json did not ship in the wheel'
          tok = CustomCIFTokenizer.from_pretrained('HF-cif-tokenizer')
          assert len(tok) > 0, 'HF-cif-tokenizer did not ship in the wheel'
          print('wheel OK:', len(MODEL_REGISTRY), 'model classes,', len(tok), 'tokens')
          "
name: CI Offline Required

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  offline-local-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install offline test dependencies
        run: uv sync --locked --extra train --extra metrics --extra notebooks

      - name: Run required offline local suite
        run: uv run python -m tests.local.runner --cpu --offline

  # Test the installed wheel outside the checkout to catch missing package data.
  wheel-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: uv build --wheel
      - name: Install and import it outside the source tree
        run: |
          mkdir /tmp/wheeltest
          uv venv /tmp/wheeltest/.venv
          uv pip install --python /tmp/wheeltest/.venv "$GITHUB_WORKSPACE"/dist/*.whl
          cd /tmp/wheeltest
          .venv/bin/python -c "
          import _load_and_generate
          from _utils.model import MODEL_REGISTRY
          from _tokenizer import CustomCIFTokenizer
          assert MODEL_REGISTRY, 'model_registry.json did not ship in the wheel'
          tok = CustomCIFTokenizer.from_pretrained('HF-cif-tokenizer')
          assert len(tok) > 0, 'HF-cif-tokenizer did not ship in the wheel'
          print('wheel OK:', len(MODEL_REGISTRY), 'model classes,', len(tok), 'tokens')
          "
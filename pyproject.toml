[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crystallm-pi"
version = "2.1.0"
description = "A Transformer-based model for property-guided crystal structure generation with containerized API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Cyprien Bone", email = "cyprien.bone.24@ucl.ac.uk" }]

dependencies = [
  "torch>=2.13",
  "transformers>=4.57,<5",
  "tokenizers>=0.22",
  "datasets>=5.0.1",
  "huggingface_hub>=0.36,<1.0",
  "pymatgen>=2025.10.7,<2026",
  "numpy>=2",
  "pandas>=3",
  "pyarrow>=15",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "joblib>=1.4.2",
  "tqdm>=4.67.1",
  "commentjson>=0.9.0",
  "pyyaml>=6.0.2",
  "requests>=2.31",
]

[project.optional-dependencies]
train = [
  "accelerate>=1.15",
  "wandb>=0.30",
  "codecarbon>=3.3",
  "h5py>=3",
  "muon-optimizer @ git+https://github.com/KellerJordan/Muon@857d1adc159e098212f828d927460782d3da59e9",
]
api = [
  "fastapi>=0.115.5",
  "uvicorn[standard]>=0.32.1",
  "pydantic>=2",
]
metrics = [
  "mace-torch>=0.3.16",
  "smact>=4",
  "material-hasher @ git+https://github.com/lematerial/material-hasher.git@b3b33e4f8a57e6bc788c0c9facd3e6b55c153505",
]
notebooks = [
  "ipywidgets>=8.1.6",
  "jarvis-tools>=2024.10.30",
  "ipykernel>=6",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
]
all = [
  "crystallm-pi[train,api,metrics,notebooks]",
]

[project.urls]
Homepage = "https://github.com/C-Bone-UCL/CrystaLLM-pi"
"Bug Tracker" = "https://github.com/C-Bone-UCL/CrystaLLM-pi/issues"

[tool.setuptools]
py-modules = [
	"_api",
	"_args",
	"_dataloader",
	"_load_and_generate",
	"_tokenizer",
	"_train",
]

[tool.setuptools.packages.find]
where = ["."]
# "tests" is deliberately not shipped. Installing it would claim the top-level name in the
# user's site-packages, where mace-torch, pybtex, dtw-python and crystal-toolkit also install
# a package called tests and the last one installed wins. The suite runs from a clone
# instead, so nothing needs it on the install path.
include = ["_models*", "_utils*"]

[tool.setuptools.package-data]
# HF-cif-tokenizer lives under _utils so it ships in the wheel. Without it an installed
# CrystaLLM-pi can only generate when run from the repo root. See resolve_tokenizer_dir.
"_utils" = ["model_registry.json", "HF-cif-tokenizer/*"]

# CUDA 12.6 wheels: the PyPI default needs driver 580+
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv]
constraint-dependencies = ["torch==2.13.*"]
